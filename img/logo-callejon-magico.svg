<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .brand-navy { fill: #0B1B3D; }
      .brand-gold { fill: #C58F38; }
      .brand-gold-stroke { stroke: #C58F38; }
    </style>
  </defs>

  <!-- ==========================================
       SHOPPING BAG WITH MAGIC STAR & SWOOSH
       ========================================== -->
  <g transform="translate(142, 10)">
    <!-- Bag Handles -->
    <!-- Back Handle Loop -->
    <path d="M 76,50 C 76,16 93,10 106,10 C 119,10 136,16 136,50" fill="none" stroke="#0B1B3D" stroke-width="7" stroke-linecap="round" />
    <!-- Front Handle Loop -->
    <path d="M 84,50 C 84,22 96,16 106,16 C 116,16 128,22 128,50" fill="none" stroke="#0B1B3D" stroke-width="7" stroke-linecap="round" />

    <!-- Bag Main 3D Silhouette -->
    <!-- Dark Navy Depth Facet (Left Gusset) -->
    <path d="M 68,50 L 96,55 L 88,144 L 52,132 Z" fill="#07142A" />
    
    <!-- Front Navy Face of Shopping Bag -->
    <path d="M 96,55 L 162,65 L 178,149 C 146,142 110,138 88,144 Z" fill="#0B1B3D" />

    <!-- Top Rim Accent Line -->
    <path d="M 68,50 L 96,55 L 162,65" fill="none" stroke="#152B5A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Golden Magic Swoosh Wrapping Around Bag -->
    <path d="M 36,155 C 55,128 86,96 122,80 C 152,68 180,64 204,66 C 174,74 142,86 116,101 C 80,123 53,151 36,155 Z" fill="#C58F38" />

    <!-- Golden Orbit Ellipse Around Star -->
    <ellipse cx="204" cy="74" rx="43" ry="18" transform="rotate(-28, 204, 74)" fill="none" stroke="#C58F38" stroke-width="4.5" stroke-dasharray="145, 28" stroke-linecap="round" />

    <!-- 4-Point Golden Magic Sparkle Star -->
    <!-- Center at (204, 72) -->
    <path d="M 204,34 Q 204,72 240,72 Q 204,72 204,110 Q 204,72 168,72 Q 204,72 204,34 Z" fill="#C58F38" />
    <!-- Core Bright Sparkle -->
    <circle cx="204" cy="72" r="3.5" fill="#FFEBB8" />
  </g>

  <!-- ==========================================
       BRAND TYPOGRAPHY
       ========================================== -->
  <!-- "Callejón" in Deep Midnight Navy (#0B1B3D) -->
  <text x="250" y="218" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#0B1B3D" letter-spacing="1">Callejón</text>

  <!-- "Mágico" in Warm Rich Gold (#C58F38) -->
  <text x="250" y="292" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#C58F38" letter-spacing="1">Mágico</text>

  <!-- Subtitle Flanked by Lateral Golden Lines -->
  <!-- Left Golden Rule -->
  <line x1="40" y1="332" x2="132" y2="332" stroke="#C58F38" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- "TIENDA DEPARTAMENTAL" in Deep Midnight Navy -->
  <text x="250" y="338" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-size="16.5" font-weight="700" fill="#0B1B3D" letter-spacing="6.5">TIENDA DEPARTAMENTAL</text>
  
  <!-- Right Golden Rule -->
  <line x1="368" y1="332" x2="460" y2="332" stroke="#C58F38" stroke-width="2.5" stroke-linecap="round" />
</svg>

